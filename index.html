<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Day · Life Organiser</title>
<style>
:root{--bg:#F6F5F1;--card:#fff;--ink:#1C1C21;--mut:#8B8B95;--line:#ECEAE4;--acc:#5B5BD6;--task:#F0605D;--ev:#3E8EF0;--food:#35B27A;--gym:#F29A38;--note:#A66CE0;--hab:#E3B22B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111113;--card:#1B1B1F;--ink:#F2F1EE;--mut:#8E8E98;--line:#2A2A30;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111113;--card:#1B1B1F;--ink:#F2F1EE;--mut:#8E8E98;--line:#2A2A30;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
#m{max-width:560px;margin:0 auto;padding:18px 18px calc(150px + env(safe-area-inset-bottom,0px))}

.sub{color:var(--mut);margin:0 0 18px}small,.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.card h2{color:var(--c,var(--mut))}[data-go]{cursor:pointer}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.grow{flex:1;min-width:0}

.chk.on{background:var(--c,var(--acc))}.chk.on::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}

.btn.solid{background:var(--c,var(--acc));color:#fff}

.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.grid b{font-size:11px;color:var(--mut);font-weight:500;padding:4px 0}
.cell{aspect-ratio:1;border:0;background:none;border-radius:14px;font:inherit;font-size:15px;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.cell.t{color:var(--acc);font-weight:700}.cell.s{background:var(--acc);color:#fff}.cell.o{opacity:.0;pointer-events:none}
.cell span{display:flex;gap:2px;height:5px}.cell span i{width:5px;height:5px;border-radius:50%;background:var(--c)}.cell.s span i{background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:0;font:inherit;font-size:13px;padding:6px 12px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--acc)) 13%,transparent);color:var(--c,var(--acc))}.chip.on{background:var(--c,var(--acc));color:#fff}
.water{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.water i{width:22px;height:22px;border-radius:7px;border:2px solid var(--ev);display:block}.water i.f{background:var(--ev)}
.big{font-size:28px;font-weight:700;letter-spacing:-.02em}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:30px;line-height:1;box-shadow:0 8px 24px rgba(0,0,0,.22);z-index:5}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px}nav button.on{color:var(--c)}
nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9;display:none;align-items:flex-end}.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:26px 26px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:12px;font-weight:600}
input,select,textarea{display:block;width:100%;margin-top5:0;margin-top:5px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
textarea{min-height:92px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{border-left:4px solid var(--note)}.up{color:var(--food)}.dw{color:var(--task)}
svg.ch{width:100%;height:110px;display:block}
.empty{color:var(--mut);text-align:center;padding:14px 0;font-size:14px}
</style></head><body><div id="m"></div>
<button class="fab" data-a="add" aria-label="Quick add">+</button>
<nav id="nav"></nav><div class="ov" id="ov"><div class="sheet" id="sh"></div></div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)},addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)},TODAY=iso(new Date()),uid=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>s===TODAY?'Today':s===addD(TODAY,1)?'Tomorrow':parse(s).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
const DEF={tasks:[],events:[],meals:[],fav:[],water:{},cardio:[],workouts:[],weights:[],habits:[],notes:[],goals:[],tg:{gym:3,cal:2200,pro:150,water:8}};
let S=structuredClone(DEF),DOC=null,tab='home',cs=TODAY,cm=new Date(),tf='today',fd=TODAY,gx='',curT='task';
try{const l=JSON.parse(localStorage.getItem('day'));if(l)S={...DEF,...l}}catch(e){}
let tm;function save(){try{localStorage.setItem('day',JSON.stringify(S))}catch(e){}clearTimeout(tm);tm=setTimeout(async()=>{try{if(DOC)await DOC.set(JSON.parse(JSON.stringify(S)))}catch(e){}},500)}
(async()=>{try{if(!window.claude)return;const db=await claude.use('db'),u=await claude.use('user');if(!db||!u)return;DOC=db.collection('data/users/'+await u.id()).doc('state');const s=await DOC.get();if(s.exists){S={...DEF,...structuredClone(s.data())};render()}else save()}catch(e){}})();
const CAT={Personal:'#5B5BD6',Work:'#3E8EF0',Social:'#F0605D',Footy:'#35B27A',Birthday:'#E3B22B',Appointment:'#A66CE0'},PC={High:'#F0605D',Medium:'#F29A38',Low:'#3E8EF0'};
function occ(e,ds){if(e.d===ds)return 1;if(!e.rep||ds<e.d)return 0;const a=parse(e.d),b=parse(ds);return e.rep==='daily'||(e.rep==='weekly'&&a.getDay()===b.getDay())||(e.rep==='monthly'&&a.getDate()===b.getDate())||(e.rep==='yearly'&&a.getDate()===b.getDate()&&a.getMonth()===b.getMonth())}
const evOn=ds=>S.events.filter(e=>occ(e,ds)).sort((a,b)=>(a.time||'')<(b.time||'')?-1:1),ws=()=>addD(TODAY,-((parse(TODAY).getDay()+6)%7)),sum=(a,k)=>a.reduce((n,x)=>n+(+x[k]||0),0);
const streak=h=>{let d=h.log[TODAY]?TODAY:addD(TODAY,-1),n=0;while(h.log[d]){n++;d=addD(d,-1)}return n};
const bar=(p,c)=>`<div class="bar" style="--c:${c}"><i style="width:${Math.min(100,p)}%"></i></div>`;
const taskRow=t=>`<div class="row"><button class="chk ${t.done?'on':''}" data-a="tt" data-i="${t.id}" style="--c:${PC[t.p]}"></button><div class="grow"><div class="${t.done?'dn':''}">${esc(t.t)}</div><small>${t.done?'Done '+fmt(t.doneAt):t.d?fmt(t.d)+(t.d<TODAY?' · overdue':''):'Inbox'}</small></div><button class="x" data-a="del" data-k="tasks" data-i="${t.id}">×</button></div>`;
const evRow=(e,ds,del)=>`<div class="row"><span class="dot" style="--c:${CAT[e.cat]}"></span><div class="grow">${esc(e.t)}<br><small>${ds?fmt(ds)+' · ':''}${e.time||'All day'}${e.rep?' · repeats '+e.rep:''} · ${e.cat}</small></div>${del?`<button class="x" data-a="del" data-k="events" data-i="${e.id}">×</button>`:''}</div>`;
const hd=(t,s)=>`<h1>${t}</h1><p class="sub">${s}</p>`,empty=t=>`<div class="empty">${t}</div>`;
function home(){const h=new Date().getHours(),list=S.tasks.filter(t=>(!t.done&&t.d&&t.d<=TODAY)||(t.done&&t.doneAt===TODAY)),dn=list.filter(t=>t.done).length,p=list.length?Math.round(dn/list.length*100):0;
let up=[];for(let i=0;i<14&&up.length<5;i++)evOn(addD(TODAY,i)).forEach(e=>up.push([e,addD(TODAY,i)]));
const wk=S.workouts.filter(w=>w.d>=ws()&&w.d<=TODAY),tr=S.workouts.some(w=>w.d===TODAY),ml=S.meals.filter(m=>m.d===TODAY),cal=sum(ml,'cal'),pro=sum(ml,'pro'),wt=S.water[TODAY]||0,g=S.tg,C=2*Math.PI*26;
return hd(h<12?'Good morning':h<18?'Good afternoon':'Good evening',parse(TODAY).toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'}))+
`<div class="card" data-go="tasks" style="--c:var(--task)"><div class="top"><h2>Today’s tasks ›</h2><svg width="60" height="60" viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" fill="none" stroke="color-mix(in srgb,var(--task) 16%,transparent)" stroke-width="6"/><circle cx="30" cy="30" r="26" fill="none" stroke="var(--task)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C*p/100} ${C}" transform="rotate(-90 30 30)"/><text x="30" y="34" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">${p}%</text></svg></div>${list.map(taskRow).join('')||empty('Nothing due today. Enjoy the space.')}</div>
<div class="card" data-go="cal" style="--c:var(--ev)"><h2>Upcoming ›</h2>${up.map(([e,d])=>evRow(e,d)).join('')||empty('No events in the next two weeks')}</div>
<div class="card" data-go="gym" style="--c:var(--gym)"><h2>Fitness ›</h2><div class="top"><div><span class="big">${wk.length}</span><span class="mut"> / ${g.gym} sessions this week</span></div><span class="pill" style="--c:${tr?'var(--food)':'var(--mut)'}">${tr?'Trained today':'Rest so far'}</span></div><div style="margin-top:10px">${bar(wk.length/g.gym*100,'var(--gym)')}</div></div>
<div class="card" data-go="food" style="--c:var(--food)"><h2>Food ›</h2><div class="top"><span class="big">${cal}<small> / ${g.cal} kcal</small></span><small>${pro}g / ${g.pro}g protein</small></div><div style="margin:10px 0">${bar(cal/g.cal*100,'var(--food)')}</div><small>${ml.map(m=>esc(m.name)).join(' · ')||'No meals logged yet'} · Water ${wt}/${g.water}</small></div>
<div class="card" data-go="notes" style="--c:var(--hab)"><h2>Habits ›</h2>${S.habits.length?`<div class="chips">${S.habits.map(x=>`<button class="chip ${x.log[TODAY]?'on':''}" style="--c:var(--hab)" data-a="hb" data-i="${x.id}">${esc(x.n)} · ${streak(x)}d</button>`).join('')}</div>`:empty('Add habits from the Notes tab')}</div>`}
function cal(){const y=cm.getFullYear(),m=cm.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();let c='';for(let i=0;i<off;i++)c+='<div></div>';
for(let d=1;d<=n;d++){const ds=y+'-'+pad(m+1)+'-'+pad(d),ev=evOn(ds).slice(0,3),tk=S.tasks.some(t=>t.d===ds&&!t.done);c+=`<button class="cell ${ds===TODAY?'t':''} ${ds===cs?'s':''}" data-a="cs" data-i="${ds}">${d}<span>${ev.map(e=>`<i style="--c:${CAT[e.cat]}"></i>`).join('')}${tk&&!ev.length?'<i style="--c:var(--task)"></i>':''}</span></button>`}
const ev=evOn(cs),tk=S.tasks.filter(t=>t.d===cs);
return hd('Calendar','Every event is remembered — go back any month.')+`<div class="card"><div class="top" style="margin-bottom:8px"><button class="btn" data-a="cmv" data-n="-1">‹</button><b>${cm.toLocaleDateString('en-AU',{month:'long',year:'numeric'})}</b><button class="btn" data-a="cmv" data-n="1">›</button></div><div class="grid">${'MTWTFSS'.split('').map(x=>`<b>${x}</b>`).join('')}${c}</div></div>
<div class="card" style="--c:var(--ev)"><h2>${fmt(cs)}</h2>${ev.map(e=>evRow(e,0,1)).join('')}${tk.map(taskRow).join('')}${ev.length+tk.length?'':empty('Nothing planned')}<button class="btn" style="margin-top:10px" data-a="add" data-i="event">+ Event</button></div>
<div class="chips">${Object.keys(CAT).map(k=>`<span class="pill" style="--c:${CAT[k]}">${k}</span>`).join('')}</div>
<div class="card" style="--c:var(--ev);margin-top:14px"><h2>All events</h2>${[...S.events].sort((a,b)=>(a.d+(a.time||''))<(b.d+(b.time||''))?-1:1).map(e=>`<div style="opacity:${e.d<TODAY&&!e.rep?.55:1}">${evRow(e,e.d,1)}</div>`).join('')||empty('No events yet')}</div>`}
function tasks(){const f={today:t=>!t.done&&t.d&&t.d<=TODAY,inbox:t=>!t.done&&!t.d,soon:t=>!t.done&&t.d>TODAY,done:t=>t.done},L=S.tasks.filter(f[tf]);if(tf==='done')L.sort((a,b)=>a.doneAt<b.doneAt?1:-1);else L.sort((a,b)=>(a.d||'9')<(b.d||'9')?-1:['High','Medium','Low'].indexOf(a.p)-['High','Medium','Low'].indexOf(b.p));
const dn=S.tasks.filter(t=>t.done&&t.doneAt===TODAY).length,tot=dn+S.tasks.filter(f.today).length;
return hd('Tasks',`${dn} of ${tot} done today (${tot?Math.round(dn/tot*100):0}%)`)+`<div class="seg">${[['today','Today & overdue'],['inbox','Inbox'],['soon','Upcoming'],['done','Completed']].map(([k,l])=>`<button class="${tf===k?'on':''}" data-a="tf" data-i="${k}">${l}</button>`).join('')}</div><div class="card" style="--c:var(--task)">${L.map(taskRow).join('')||empty(tf==='inbox'?'Inbox zero. Leave a task undated to park it here.':'Nothing here')}</div>`}
function food(){const ms=S.meals.filter(m=>m.d===fd),g=S.tg,w=S.water[fd]||0,st=(k,l,u)=>`<div class="row"><div class="grow">${l}</div><button class="btn" data-a="tg" data-k="${k}" data-n="-${u}">−</button><b style="min-width:52px;text-align:center">${g[k]}</b><button class="btn" data-a="tg" data-k="${k}" data-n="${u}">+</button></div>`;
return hd('Food','Plan ahead or look back — pick any day.')+`<div class="top card" style="--c:var(--food)"><button class="btn" data-a="fd" data-n="-1">‹</button><b>${fmt(fd)}</b><button class="btn" data-a="fd" data-n="1">›</button></div>
<div class="card" style="--c:var(--food)"><div class="top"><span class="big">${sum(ms,'cal')}<small> / ${g.cal} kcal</small></span><small>${sum(ms,'pro')}g / ${g.pro}g P</small></div><div style="margin-top:10px">${bar(sum(ms,'cal')/g.cal*100,'var(--food)')}</div></div>
${['Breakfast','Lunch','Dinner','Snack'].map(t=>{const l=ms.filter(m=>m.type===t);return`<div class="card" style="--c:var(--food)"><h2>${t}</h2>${l.map(m=>`<div class="row"><div class="grow">${esc(m.name)}<br><small>${m.cal} kcal · ${m.pro}g protein</small></div><button class="x" data-a="del" data-k="meals" data-i="${m.id}">×</button></div>`).join('')||'<small>Nothing planned</small>'}</div>`}).join('')}
${S.fav.length?`<div class="card" style="--c:var(--food)"><h2>Favourites · tap to add</h2><div class="chips">${S.fav.map(f=>`<button class="chip" style="--c:var(--food)" data-a="fav" data-i="${f.id}">${esc(f.name)}</button>`).join('')}</div></div>`:''}
<div class="card" style="--c:var(--ev)"><h2>Water</h2><div class="water">${Array.from({length:Math.max(g.water,w)},(_,i)=>`<i class="${i<w?'f':''}"></i>`).join('')}</div><div style="margin-top:10px"><button class="btn" data-a="wat" data-n="-1">−</button> <button class="btn solid" data-a="wat" data-n="1">+ Glass</button></div></div>
<div class="card" style="--c:var(--food)"><h2>Daily targets</h2>${st('cal','Calories',100)}${st('pro','Protein (g)',5)}${st('water','Water (glasses)',1)}</div>`}
function gym(){const asc=[...S.workouts].sort((a,b)=>a.d<b.d?-1:1),last={},dl={},pb={};
asc.forEach(w=>w.ex.forEach((e,i)=>{const k=e.n.toLowerCase(),p=last[k];dl[w.id+i]=p?e.w-p.w:null;last[k]=e;if(!pb[k]||e.w>=pb[k].w)pb[k]={...e,d:w.d}}));
const names=Object.values(pb).map(x=>x.n),sel=gx&&pb[gx.toLowerCase()]?gx:names[0]||'',pts=asc.flatMap(w=>w.ex.filter(e=>e.n===sel).map(e=>e.w)),mx=Math.max(...pts,1),mn=Math.min(...pts,mx),
xy=pts.map((v,i)=>[10+(pts.length>1?i/(pts.length-1):.5)*280,95-(mx===mn?.5:(v-mn)/(mx-mn))*80]);
const wk=S.workouts.filter(w=>w.d>=ws()&&w.d<=TODAY).length,bw=[...S.weights].sort((a,b)=>a.d<b.d?-1:1);
return hd('Gym','Compare every session with the last.')+`<div class="card" style="--c:var(--gym)"><div class="top"><div><span class="big">${wk}</span><span class="mut"> / ${S.tg.gym} this week</span></div><div><button class="btn" data-a="tg" data-k="gym" data-n="-1">−</button> <button class="btn" data-a="tg" data-k="gym" data-n="1">+</button></div></div><div style="margin:10px 0 12px">${bar(wk/S.tg.gym*100,'var(--gym)')}</div><button class="btn solid" data-a="add" data-i="workout">Log workout</button> <button class="btn" data-a="add" data-i="import">Paste from Hevy</button></div>
${names.length?`<div class="card" style="--c:var(--gym)"><h2>Strength progress</h2><div class="chips" style="margin-bottom:8px">${names.map(n=>`<button class="chip ${n===sel?'on':''}" style="--c:var(--gym)" data-a="gx" data-i="${esc(n)}">${esc(n)}</button>`).join('')}</div><svg class="ch" viewBox="0 0 300 110"><polyline fill="none" stroke="var(--gym)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${xy.map(p=>p.join(',')).join(' ')}"/>${xy.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--gym)"/>`).join('')}</svg><small>Best weight per session: ${mn}–${mx} kg</small></div>
<div class="card" style="--c:var(--gym)"><h2>Personal bests</h2>${Object.values(pb).map(e=>`<div class="row"><div class="grow">${esc(e.n)}</div><b>${e.w} kg</b><small>×${e.r} · ${fmt(e.d)}</small></div>`).join('')}</div>`:''}
<div class="card" style="--c:var(--gym)"><h2>History</h2>${[...S.workouts].sort((a,b)=>a.d<b.d?1:-1).map(w=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="top"><b>${esc(w.name)}</b><span><small>${fmt(w.d)}</small><button class="x" data-a="del" data-k="workouts" data-i="${w.id}">×</button></span></div>${w.ex.map((e,i)=>{const d=dl[w.id+i];return`<div class="top"><small>${esc(e.n)} · ${e.x?e.s+' sets · top '+e.w+' kg × '+e.r:e.s+'×'+e.r+' @ '+e.w+' kg'}</small>${d==null?'':`<small class="${d>0?'up':d<0?'dw':''}">${d>0?'▲ +'+d:d<0?'▼ '+d:'= same'}</small>`}</div>`}).join('')}</div>`).join('')||empty('No workouts yet')}</div>
<div class="card" style="--c:var(--gym)"><div class="top"><h2>Body weight</h2><button class="btn" data-a="add" data-i="weight">+ Log</button></div>${bw.slice(-6).reverse().map(x=>`<div class="row"><div class="grow">${x.w} kg</div><small>${fmt(x.d)}</small></div>`).join('')||empty('Optional — log whenever you like')}</div>
<div class="card" style="--c:var(--gym)"><div class="top"><h2>Cardio</h2><button class="btn" data-a="add" data-i="cardio">+ Log</button></div>${(()=>{const c=S.cardio.filter(x=>x.d>=ws()&&x.d<=TODAY),km=sum(c,'km');return`<div style="margin-bottom:6px"><span class="big">${sum(c,'min')}</span><span class="mut"> min · ${c.length} session${c.length===1?'':'s'} this week${km?' · '+km.toFixed(1)+' km':''}</span></div>`})()}${[...S.cardio].sort((a,b)=>a.d<b.d?1:-1).map(x=>`<div class="row"><div class="grow">${x.type} · ${x.min} min${x.km?' · '+x.km+' km':''}<br><small>${fmt(x.d)}${x.km&&x.min?' · '+(x.min/x.km).toFixed(1)+' min/km':''}</small></div><button class="x" data-a="del" data-k="cardio" data-i="${x.id}">×</button></div>`).join('')||empty('No cardio logged yet')}</div>`}
function notes(){return hd('Notes & Goals','Capture now, schedule later.')+
`<div class="card" style="--c:var(--hab)"><div class="top"><h2>Habits</h2><button class="btn" data-a="add" data-i="habit">+ New</button></div>${S.habits.map(h=>`<div class="row"><button class="chk ${h.log[TODAY]?'on':''}" data-a="hb" data-i="${h.id}" style="--c:var(--hab)"></button><div class="grow">${esc(h.n)}<br><small>${streak(h)} day streak · ${Object.keys(h.log).length} total</small></div><div style="display:flex;gap:3px">${[6,5,4,3,2,1,0].map(i=>`<i class="dot" style="--c:${h.log[addD(TODAY,-i)]?'var(--hab)':'var(--line)'}"></i>`).join('')}</div><button class="x" data-a="del" data-k="habits" data-i="${h.id}">×</button></div>`).join('')||empty('No habits yet')}</div>
<div class="card" style="--c:var(--note)"><div class="top"><h2>Goals</h2><button class="btn" data-a="add" data-i="goal">+ New</button></div>${S.goals.map(g=>`<div style="padding:8px 0"><div class="top"><b>${esc(g.t)}</b><span><button class="x" data-a="gp" data-i="${g.id}" data-n="-10">−</button><small>${g.pct}%</small><button class="x" data-a="gp" data-i="${g.id}" data-n="10">+</button><button class="x" data-a="del" data-k="goals" data-i="${g.id}">×</button></span></div>${bar(g.pct,'var(--note)')}</div>`).join('')||empty('Long-term plans live here')}</div>
<div class="top" style="margin-bottom:10px"><h2 style="margin:0">Notes & ideas</h2><button class="btn" style="--c:var(--note)" data-a="add" data-i="note">+ Note</button></div>${S.notes.map(n=>`<div class="card note"><div class="top"><b>${esc(n.t)}</b><button class="x" data-a="del" data-k="notes" data-i="${n.id}">×</button></div>${n.x?`<div class="mut" style="white-space:pre-wrap">${esc(n.x)}</div>`:''}<div class="top" style="margin-top:8px"><small>${fmt(n.d)}</small><button class="btn" style="--c:var(--task)" data-a="mk" data-i="${n.id}">Make task</button></div></div>`).join('')||empty('No notes yet')}`}
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',tasks:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',food:'<path d="M7 3v8a3 3 0 0 0 3 3v7M4 3v6M10 3v6M17 3c-2 2-3 5-3 8h3v10"/>',gym:'<path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/>',notes:'<path d="M5 3h10l4 4v14H5z"/><path d="M9 12h6M9 16h6"/>'},TC={home:'--acc',cal:'--ev',tasks:'--task',food:'--food',gym:'--gym',notes:'--note'},TN={home:'Home',cal:'Calendar',tasks:'Tasks',food:'Food',gym:'Gym',notes:'Notes'};
function render(){$('#m').innerHTML={home,cal,tasks,food,gym,notes}[tab]();$('#nav').innerHTML=Object.keys(IC).map(k=>`<button class="${tab===k?'on':''}" style="--c:var(${TC[k]})" data-a="tab" data-i="${k}"><svg viewBox="0 0 24 24">${IC[k]}</svg>${TN[k]}</button>`).join('')}
const inp=(n,l,t='text',v='',x='')=>`<label>${l}<input name="${n}" type="${t}" value="${esc(v)}" ${x}></label>`,sel=(n,l,o,v)=>`<label>${l}<select name="${n}">${o.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select></label>`;
const FORM={task:()=>inp('t','Task','text','','required placeholder="What needs doing?"')+inp('d','Due date (leave empty for Inbox)','date',tab==='tasks'&&tf==='today'?TODAY:'')+sel('p','Priority',['High','Medium','Low'],'Medium'),
event:()=>inp('t','Event','text','','required placeholder="Footy, dentist, birthday…"')+`<div class="two">${inp('d','Date','date',tab==='cal'?cs:TODAY,'required')+inp('time','Time (optional)','time')}</div><div class="two">${sel('cat','Category',Object.keys(CAT),'Personal')+sel('rep','Repeats',['Never','Daily','Weekly','Monthly','Yearly'],'Never')}</div>`,
meal:()=>inp('name','Meal','text','','required placeholder="e.g. Chicken wrap with salad"')+`<div class="two">${inp('d','Date','date',tab==='food'?fd:TODAY)+sel('type','Meal',['Breakfast','Lunch','Dinner','Snack'],'Lunch')}</div><div class="two">${inp('cal','Calories','number','','inputmode="numeric"')+inp('pro','Protein (g)','number','','inputmode="numeric"')}</div><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="fav" style="width:auto;margin:0"> Save as favourite</label>`,
workout:()=>inp('name','Workout','text','','required placeholder="Push day"')+inp('d','Date','date',TODAY)+`<label>Exercises (one per line: name sets×reps weight)<textarea name="ex" required placeholder="Bench press 3x8 60&#10;Overhead press 3x10 35"></textarea></label>`,
cardio:()=>sel('type','Type',['Run','Walk','Cycle','Oztag','Outdoor walk','Other'],'Run')+`<div class="two">${inp('d','Date','date',TODAY)+inp('min','Minutes','number','','required inputmode="numeric"')}</div>`+inp('km','Distance in km (optional)','number','','step="0.01" inputmode="decimal"'),
import:()=>`<label>Paste your Hevy workout<textarea name="txt" required style="min-height:220px" placeholder="Paste the whole thing here…"></textarea></label><small class="dw" id="er"></small><div style="height:10px"></div>`,weight:()=>inp('w','Body weight (kg)','number','','required step="0.1" inputmode="decimal"')+inp('d','Date','date',TODAY),note:()=>inp('t','Title','text','','required placeholder="Idea, list, plan…"')+`<label>Details<textarea name="x"></textarea></label>`,goal:()=>inp('t','Goal','text','','required placeholder="Run a half marathon"'),habit:()=>inp('n','Habit','text','','required placeholder="Read 20 minutes"')};
function open(t){curT=t;const m=['task','event','meal','workout','cardio'];$('#sh').innerHTML=(m.includes(t)?`<div class="seg">${m.map(k=>`<button class="${k===t?'on':''}" data-a="ty" data-i="${k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div>`:'')+`<form>${FORM[t]()}<div class="two"><button type="button" class="btn" style="--c:var(--mut)" data-a="close">Cancel</button><button class="btn solid">Save</button></div></form>`;$('#ov').classList.add('on')}
document.addEventListener('submit',e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target)),t=curT,id=uid();
if(t==='task')S.tasks.push({id,t:v.t,d:v.d,p:v.p,done:false});
if(t==='event')S.events.push({id,t:v.t,d:v.d,time:v.time,cat:v.cat,rep:v.rep==='Never'?'':v.rep.toLowerCase()});
if(t==='meal'){const m={name:v.name,type:v.type,cal:+v.cal||0,pro:+v.pro||0};S.meals.push({id,d:v.d,...m});if(v.fav)S.fav.push({id:uid(),...m})}
if(t==='workout'){const ex=v.ex.split('\n').map(l=>l.match(/^(.+?)\s+(\d+)\s*[x×]\s*(\d+)(?:\s*@?\s*([\d.]+))?/i)).filter(Boolean).map(r=>({n:r[1].trim(),s:+r[2],r:+r[3],w:+r[4]||0}));S.workouts.push({id,d:v.d,name:v.name,ex})}
if(t==='cardio')S.cardio.push({id,d:v.d,type:v.type,min:+v.min||0,km:+v.km||0});
if(t==='import'){const w=hevy(v.txt);if(!w.ex.length){$('#er').textContent='Couldn’t find any sets — paste the full Hevy text.';return}S.workouts.push({id,...w})}
if(t==='weight')S.weights.push({d:v.d,w:+v.w});if(t==='note')S.notes.push({id,t:v.t,x:v.x,d:TODAY});if(t==='goal')S.goals.push({id,t:v.t,pct:0});if(t==='habit')S.habits.push({id,n:v.n,log:{}});
$('#ov').classList.remove('on');save();render()});
const find=(k,i)=>S[k].find(x=>x.id===i);
function hevy(txt){const N=txt.split('\n').map(l=>l.trim()).filter(Boolean),name=N[0]||'Workout';let d=TODAY;const m=txt.match(/([A-Z][a-z]{2})[a-z]*\s+(\d{1,2}),\s*(\d{4})/),mi=m?'JanFebMarAprMayJunJulAugSepOctNovDec'.indexOf(m[1]):-1;if(mi>=0)d=m[3]+'-'+pad(mi/3+1)+'-'+pad(+m[2]);
const R=/^Set\s*\d+:\s*(?:([\d.]+)\s*(?:kg|lbs?)?\s*x\s*)?(\d+)(.*)$/i,ex=[];let c=null;N.forEach((l,i)=>{const s=l.match(R);if(s){if(c&&!/warm/i.test(s[3]))c.sets.push({w:+s[1]||0,r:+s[2]})}else if(N[i+1]&&R.test(N[i+1])){c={n:l,sets:[]};ex.push(c)}});
return{d,name,ex:ex.filter(e=>e.sets.length).map(e=>{const t=e.sets.reduce((a,b)=>b.w>a.w||(b.w===a.w&&b.r>a.r)?b:a);return{n:e.n,s:e.sets.length,r:t.r,w:t.w,x:1}})}}
async function est(b){const f=b.closest('form'),n=f.elements.name.value.trim();if(!n){b.textContent='Type the meal first';return}b.textContent='Estimating…';try{const s=await claude.use('sample');if(!s)throw 0;const r=await s.json('Estimate typical calories and grams of protein for one normal serving of this meal: "'+n+'". Reply with only JSON like {"cal":500,"pro":30}',{modelTier:'quick'});f.elements.cal.value=Math.round(r.cal);f.elements.pro.value=Math.round(r.pro);b.textContent='✨ Estimated — adjust if needed'}catch(e){b.textContent='Estimate unavailable — enter manually'}}
document.addEventListener('click',e=>{if(e.target.id==='ov'){$('#ov').classList.remove('on');return}const b=e.target.closest('[data-a]');if(!b){const g=e.target.closest('[data-go]');if(g){tab=g.dataset.go;scrollTo(0,0);render()}return}const a=b.dataset.a,i=b.dataset.i,n=+b.dataset.n,k=b.dataset.k;
if(a==='close'){$('#ov').classList.remove('on');return}
if(a==='est'){est(b);return}
if(a==='add'){open(i||{home:'task',cal:'event',tasks:'task',food:'meal',gym:'workout',notes:'note'}[tab]);return}
if(a==='ty'){open(i);return}
if(a==='tab'){tab=i;scrollTo(0,0)}
if(a==='tt'){const t=find('tasks',i);t.done=!t.done;t.doneAt=t.done?TODAY:''}
if(a==='del')S[k]=S[k].filter(x=>x.id!==i);
if(a==='hb'){const h=find('habits',i);h.log[TODAY]?delete h.log[TODAY]:h.log[TODAY]=1}
if(a==='cs')cs=i;if(a==='cmv')cm=new Date(cm.getFullYear(),cm.getMonth()+n,1);if(a==='tf')tf=i;if(a==='gx')gx=i;
if(a==='fd')fd=addD(fd,n);if(a==='wat')S.water[fd]=Math.max(0,(S.water[fd]||0)+n);
if(a==='tg')S.tg[k]=Math.max(1,S.tg[k]+n);
if(a==='fav'){const f=find('fav',i);S.meals.push({id:uid(),d:fd,name:f.name,type:f.type,cal:f.cal,pro:f.pro})}
if(a==='gp'){const g=find('goals',i);g.pct=Math.max(0,Math.min(100,g.pct+n))}
if(a==='mk'){const t=find('notes',i);S.tasks.push({id:uid(),t:t.t,d:'',p:'Medium',done:false});tab='tasks';tf='inbox'}
save();render()});
render();
</script></body></html>
